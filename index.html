<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INICIO</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Módulos de Firebase para base de datos en la nube en tiempo real -->
    <script type="importmap">
     
    </script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f7f5f0;
            color: #2c3e35;
        }
        .botones {
   padding: 5px 10px;
        font-size: 18px;
        font-family: "Poppins", sans-serif;
        font-weight: 5;
        color: #d3d8db;
        background: linear-gradient(45deg, #0e3c58,  #72849f);
        border: none;
        border-radius: 50px;
        cursor: pointer;
        box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
        z-index: 999;
        margin: 5px 0;
    text-shadow:0 0 20px currentColor;
    
    }
        .font-serif {
            font-family: 'Playfair Display', serif;
        }
        .hero-bg {
            background-image: linear-gradient(rgba(44, 62, 53, 0.45), rgba(44, 62, 53, 0.65)), url('https://conhecimentocientifico.r7.com/wp-content/uploads/2020/03/ceu-estrelado_1048-11828.jpg.webp');
            background-size: cover;
            background-position: center;
        }
        .leaf-decor {
            opacity: 0.15;
            pointer-events: none;
        }

        /* Petalos cayendo */
        .petals-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 30;
            overflow: hidden;
        }
        .petal {
            position: absolute;
            top: -40px;
            opacity: 0.7;
            animation: petalFall linear infinite;
        }
        @keyframes petalFall {
            0% { transform: translateY(-10%) rotate(0deg) translateX(0); opacity: 0.8; }
            25% { transform: translateY(25vh) rotate(90deg) translateX(15px); }
            50% { transform: translateY(50vh) rotate(180deg) translateX(-10px); opacity: 0.6; }
            75% { transform: translateY(75vh) rotate(270deg) translateX(20px); }
            100% { transform: translateY(105vh) rotate(360deg) translateX(-5px); opacity: 0; }
        }

        /* Corazones flotantes en hero */
        .hearts-container {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
        }
        .floating-heart {
            position: absolute;
            bottom: -20px;
            color: rgba(255, 255, 255, 0.15);
            animation: floatUp linear infinite;
        }
        @keyframes floatUp {
            0% { transform: translateY(0) scale(0.5) rotate(0deg); opacity: 0; }
            10% { opacity: 0.6; }
            100% { transform: translateY(-100vh) scale(1.2) rotate(25deg); opacity: 0; }
        }

        /* Animaciones de entrada para secciones */
        .fade-in-section {
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease-out, transform 0.8s ease-out;
        }
        .fade-in-section.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Brillo dorado en titulos */
        .gold-shimmer {
            background: linear-gradient(90deg, #2c3e35, #797bec, #2c3e35);
            background-size: 200% auto;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: shimmer 4s ease-in-out infinite;
        }
        @keyframes shimmer {
            0%, 100% { background-position: 0% center; }
            50% { background-position: 200% center; }
        }

        /* Anillos girando */
        .rings-icon {
            display: inline-block;
            animation: ringsPulse 3s ease-in-out infinite;
        }
        @keyframes ringsPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1) rotate(5deg); }
        }

        /* Separador decorativo */
        .wedding-divider {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 20px 0;
        }
        .wedding-divider::before,
        .wedding-divider::after {
            content: '';
            height: 1px;
            width: 60px;
            background: linear-gradient(90deg, transparent, #b8860b, transparent);
        }
    </style>
</head>
<body class="antialiased selection:bg-emerald-800 selection:text-white">

    <!-- Petalos cayendo -->
    <div class="petals-container" id="petalsContainer"></div>

    <!-- Música de fondo - Piano romántico -->
    <div class="fixed bottom-6 right-6 z-40">
        <button id="musicToggle" class="bg-emerald-800 hover:bg-emerald-900 text-white p-4 rounded-full shadow-lg transition-transform transform hover:scale-110 flex items-center justify-center">
            <i id="musicIcon" class="fas fa-music"></i>
        </button>
        <audio id="bgMusic" loop preload="auto">
            <source src="assets/those-eyes-new-west.mp3" type="audio/mpeg">
        </audio>
    </div>

    <!-- SECCIÓN DE BIENVENIDA (HERO) -->
    <section class="hero-bg h-screen w-full flex flex-col justify-between items-center text-center px-4 py-12 text-white relative">
        <!-- Corazones flotantes de fondo -->
        <div class="hearts-container" id="heartsContainer"></div>

        <div class="mt-12">
            <p class="uppercase tracking-widest text-sm md:text-base font-semibold text-emerald-100">¡HISTORY!</p>
            <div class="wedding-divider">
                
            </div>
        </div>

        <div class="my-auto px-2">
            <h1 class="font-serif text-5xl md:text-7xl font-light mb-6 tracking-wide gold-shimmer">
                PROXIMAMENTE
            </h1>
            <button class="botones" onclick="enviarMensaje()">SIGUIENTE</button>
             <script src="script.js"></script></div>
    
        </div>

      
    
</body>
</html>
